@let locations = locations$ | async;
<div class="location-overview-header">
  <a class="location-overview-create" [routerLink]="navigateToLocationCreatePage()">
    + Add new Location
  </a>
</div>
<div class="location-overview-container">
  @for (location of locations; track location.id) {
    <div class="location-card">
      <h3>{{ location.name }}</h3>
      <div class="button-container">
        <chem-button (click)="editLocation(location.id)" [type]=ButtonType.PRIMARY>Edit</chem-button>
        <chem-button (click)="deleteLocation(location)" [type]=ButtonType.DANGER>Delete</chem-button>
      </div>
    </div>
  }
</div>
