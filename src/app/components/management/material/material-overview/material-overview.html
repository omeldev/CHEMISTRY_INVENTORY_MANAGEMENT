@let materials = materials$ | async;
<div class="management-header">
  <a class="create" [routerLink]="navigateToMaterialCreatePage()">
    + Add new Material
  </a>
</div>
<div class="management-overview-container">
  @for (material of materials; track material.id) {
    <div class="management-card">
      <h3>{{ material.name }}</h3>
      <div class="management-button-container">
        <chem-button (click)="editMaterial(material.id)" [type]=ButtonType.PRIMARY>Edit</chem-button>
        <chem-button (click)="deleteMaterial(material)" [type]=ButtonType.DANGER>Delete</chem-button>
      </div>
    </div>
  }
</div>
